<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        @font-face {
            font-family: "FX_LED";
            src: url("FX-LED Bold.TTF");
        }

        @font-face {
            font-family: "HACK";
            src: url("FX-LED Bold.TTF");
        }
       

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #bbbbbb, #cacaca);
            font-family: 'Arial', sans-serif;
            margin: 0;
        }

        .calculator {
            width: 300px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            gap: 10px;
        }

        .display {
            grid-column: span 4;
            height: 60px;
            background: rgba(86, 83, 83, 0.2);
            border: none;
            border-radius: 10px;
            text-align: right;
            max-width: 280px;
            font-size: 3rem;
            color: #ffffff;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            font-family: "FX_LED";
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
        }

        button {
            height: 60px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.3);
            color: #333;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        button[aria-label="Delete"] {
            background: rgb(255, 100, 100);
            color: #fff;

        }
    </style>
</head>

<body>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        <div class="buttons" id="buttons">
            <button aria-label="Clear">AC</button> <button aria-label="Delete">Del</button><button
                aria-label="Percentage">%</button><button aria-label="Divide">/</button>
            <button aria-label="7">7</button><button aria-label="8">8</button><button aria-label="9">9</button>

            <button aria-label="Multiply">*</button><button aria-label="4">4</button>
            <button aria-label="5">5</button><button aria-label="6">6</button><button aria-label="Subtract">-</button>
            <button aria-label="1">1</button>
            <button aria-label="2">2</button><button aria-label="3">3</button>

            <button aria-label="Add">+</button>
            <button aria-label="Square Root">√</button>
            <button aria-label="0">0</button>
            <button aria-label=".">.</button>
            <button aria-label="Equals" class="equal">=</button>
        </div>
    </div>
    <script>
        const display = document.getElementById("display");

        // Function to safely evaluate expressions
        function evaluateExpression(expression) {
            try {
                return new Function(`return ${expression}`)();
            } catch {
                return "Error";
            }
        }

        // Handle button clicks
        document.getElementById("buttons").addEventListener("click", function (event) {
            const value = event.target.innerText;

            if (!event.target.matches("button")) return;

            if (value === "AC") {
                display.value = "";
            } else if (value === "Del") {
                display.value = display.value.slice(0, -1); // Remove the last character
            } else if (value === "=") {
                display.value = evaluateExpression(display.value);
            } else if (value === "√") {
                display.value = Math.sqrt(parseFloat(display.value)) || "Error";
            } else if (value === "%") {
                display.value = parseFloat(display.value) / 100 || "Error";
            } else {
                display.value += value;
            }
        });

        // Handle keyboard input
        document.addEventListener("keydown", function (event) {
            const key = event.key;

            if (!isNaN(key) || "+-*/.".includes(key)) {
                display.value += key;
            } else if (key === "Enter") {
                display.value = evaluateExpression(display.value);
            } else if (key === "Backspace") {
                display.value = display.value.slice(0, -1);
            } else if (key === "Escape") {
                display.value = "";
            }
        });
    </script>
</body>

</html>
